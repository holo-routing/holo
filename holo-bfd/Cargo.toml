[package]
name = "holo-bfd"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
bitflags.workspace = true
chrono.workspace = true
derive-new.workspace = true
generational-arena.workspace = true
ipnetwork.workspace = true
itertools.workspace = true
num-derive.workspace = true
num-traits.workspace = true
phf.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
yang5.workspace = true

holo-northbound = { path = "../holo-northbound", features = ["bfd"] }
holo-protocol = { path = "../holo-protocol" }
holo-utils = { path = "../holo-utils" }
holo-yang = { path = "../holo-yang" }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true
socket2.workspace = true

[dev-dependencies]
yang5 = { workspace = true, features = ["bundled"] }

holo-bfd = { path = ".", features = ["testing", "deterministic"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
criterion.workspace = true

[build-dependencies]
yang5 = { workspace = true, features = ["bundled"] }
holo-northbound = { path = "../holo-northbound", features = ["bfd"] }
holo-yang = { path = "../holo-yang" }
holo-platform = { path = "../holo-platform" }

[lints]
workspace = true

[features]
default = []
testing = [
  "holo-northbound/testing",
  "holo-protocol/testing",
  "holo-utils/testing",
]
deterministic = []
