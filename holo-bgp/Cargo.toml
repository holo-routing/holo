[package]
name = "holo-bgp"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
twox-hash = { version = "2.1", optional = true }

arbitrary.workspace = true
arc-swap.workspace = true
bitflags.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
derive-new.workspace = true
enum-as-inner.workspace = true
generational-arena.workspace = true
ipnetwork.workspace = true
itertools.workspace = true
num-derive.workspace = true
num-traits.workspace = true
phf.workspace = true
prefix-trie.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
tokio.workspace = true
tracing.workspace = true
yang5.workspace = true

holo-northbound = { path = "../holo-northbound", features = ["bgp"] }
holo-protocol = { path = "../holo-protocol" }
holo-utils = { path = "../holo-utils" }
holo-yang = { path = "../holo-yang" }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
const-addrs.workspace = true
yang5 = { workspace = true, features = ["bundled"] }

holo-bgp = { path = ".", features = ["testing", "deterministic"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
criterion.workspace = true

[build-dependencies]
yang5 = { workspace = true, features = ["bundled"] }
holo-northbound = { path = "../holo-northbound", features = ["bgp"] }
holo-yang = { path = "../holo-yang" }

[lints]
workspace = true

[features]
default = []
testing = [
  "holo-northbound/testing",
  "holo-protocol/testing",
  "holo-utils/testing",
]
deterministic = ["dep:twox-hash"]

[[bench]]
name = "msg_encoding"
harness = false

[[bench]]
name = "msg_decoding"
harness = false
