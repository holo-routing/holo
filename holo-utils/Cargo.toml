[package]
name = "holo-utils"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
vectorize = "0.2.0"

arbitrary.workspace = true
bitflags.workspace = true
bytes.workspace = true
chrono.workspace = true
derive-new.workspace = true
enum-as-inner.workspace = true
futures.workspace = true
ipnetwork.workspace = true
itertools.workspace = true
num-derive.workspace = true
num-traits.workspace = true
pickledb.workspace = true
prefix-trie.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha-crypt.workspace = true
tokio.workspace = true
tracing.workspace = true
yang5.workspace = true

holo-yang = { path = "../holo-yang" }
reqwest = { version = "0.13.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
capctl.workspace = true
libc.workspace = true
nix.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["net"] }

[build-dependencies]
holo-platform = { path = "../holo-platform" }

[dev-dependencies]
const-addrs.workspace = true

[lints.rust]
rust_2018_idioms = "warn"

[lints.clippy]
too_many_arguments = "allow"
manual_range_contains = "allow"

[features]
default = []
testing = []
fastclick = ["dep:reqwest"]
