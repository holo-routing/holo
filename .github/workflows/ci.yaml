name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  # Make sure CI fails on all warnings, including Clippy lints
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-01
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: "rustfmt --check"
        run: |
          if ! rustfmt --check $(git ls-files '*.rs'); then
            printf "Please run \`rustfmt \$(git ls-files '*.rs')\` locally to fix formatting errors.\nSee CONTRIBUTING.md for more details.\n" >&2
            exit 1
          fi

  clippy_check:
    name: Lint Check (Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy
      - name: Install Protocol Buffers Compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Set PROTOC Environment Variable
        run: export PROTOC=/path/to/protoc
      - name: Run Clippy
        run: cargo clippy
      - name: Run Clippy
        run: cargo clippy -p holo-tools -p holo-replay

  tests_and_coverage_report:
    name: Tests and Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --codecov --output-path codecov.json -p holo-bfd -p holo-bgp -p holo-isis -p holo-ldp -p holo-ospf -p holo-rip -p holo-utils -p holo-vrrp
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/master' && github.repository_owner == 'holo-routing'
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tests_arm:
    name: Tests (Arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
      - name: Run tests
        run: cargo test --all-features -p holo-bfd -p holo-bgp -p holo-isis -p holo-ldp -p holo-ospf -p holo-rip -p holo-utils -p holo-vrrp 

  tests_wasm:
    name: Tests (Wasm)
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "25"
      WASMTIME_VERSION: "29.0.1"
      PCRE2_VERSION: "10.44"
      # Toolchain directory, kept next to the checkout.
      WASI_DIR: ${{ github.workspace }}/../wasi
      WASI_SDK_PATH: ${{ github.workspace }}/../wasi/sdk
      PCRE2_INCLUDE_DIR: ${{ github.workspace }}/../wasi/include
      PCRE2_LIBRARY: ${{ github.workspace }}/../wasi/lib/libpcre2-8.a
      # The test fixtures are reached by absolute path, so the repository is preopened under its host path.
      CARGO_TARGET_WASM32_WASIP1_RUNNER: ${{ github.workspace }}/../wasi/wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}
      CARGO_TARGET_WASM32_WASIP1_LINKER: ${{ github.workspace }}/../wasi/sdk/bin/clang
      RUSTFLAGS: "-Dwarnings -Clink-self-contained=no"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install WASI toolchain
        run: |
          set -euo pipefail
          mkdir -p "$WASI_DIR" && cd "$WASI_DIR"
          # Later SDKs no longer ship the emulated pthread library libyang links against.
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | tar xz && mv "wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" sdk
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar xJ && mv "wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" wasmtime
          # libyang is built from source and needs a PCRE2 for the same target; its JIT has no wasm backend.
          curl -sSfL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz" | tar xz
          cmake -S "pcre2-${PCRE2_VERSION}" -B pcre2-build -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk-p1.cmake" -DWASI_SDK_PREFIX="$WASI_SDK_PATH" -DCMAKE_INSTALL_PREFIX="$WASI_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DPCRE2_BUILD_PCRE2GREP=OFF -DPCRE2_BUILD_TESTS=OFF -DPCRE2_SUPPORT_JIT=OFF
          cmake --build pcre2-build --target install -j"$(nproc)"
      - name: Run tests
        run: cargo test --target wasm32-wasip1 -p holo-bfd -p holo-bgp -p holo-isis -p holo-ldp -p holo-ospf -p holo-rip -p holo-utils -p holo-vrrp

  fuzz-build-check:
    name: Fuzz Targets Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # cargo-fuzz requires nightly Rust due to LLVM sanitizer support
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-01
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Check fuzz targets
        run: cargo fuzz check

  bench-build-check:
    name: Benchmark Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91
      - name: Check benchmark builds
        run: cargo bench --no-run -p holo-bgp -p holo-ldp -p holo-ospf

  docker-build-holod:
    name: "Docker Build: holod"
    uses: ./.github/workflows/docker-build-and-attest.yml
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'holo-routing'
    with:
      image-name: holod
      dockerfile: docker/Dockerfile.holod
    permissions:
      id-token: write
      attestations: write
      packages: write

  docker-build-holo-bundle:
    name: "Docker Build: holo-bundle"
    needs: docker-build-holod
    uses: ./.github/workflows/docker-build-and-attest.yml
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'holo-routing'
    with:
      image-name: holo-bundle
      dockerfile: docker/Dockerfile.holo-bundle
    permissions:
      id-token: write
      attestations: write
      packages: write
